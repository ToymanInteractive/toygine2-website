name: Remove pull request preview

on:
  pull_request_target:
    types: [closed]

concurrency:
  group: pages-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  remove-preview:
    # Forks get no preview, so there is nothing of theirs to remove
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Syncing an empty folder with clean deletes the preview subfolder
      - name: Create empty folder
        run: mkdir empty

      - name: Remove preview from toygine2 GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          ssh-key: ${{ secrets.TOYGINE2_PAGES_DEPLOY_KEY }}
          repository-name: ToymanInteractive/toygine2
          branch: gh-pages
          folder: empty
          target-folder: pr-preview/pr-${{ github.event.pull_request.number }}
          clean: true
          git-config-name: github-actions[bot]
          git-config-email: 41898282+github-actions[bot]@users.noreply.github.com
          commit-message: >-
            preview: remove ${{ github.repository }}#${{
            github.event.pull_request.number }}

      - name: Comment preview removal
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: pr-preview
          only_update: true
          message: |
            Site preview removed: the pull request is closed.
