name: Update engine documentation

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update:
    concurrency:
      group: update-engine-documentation
      cancel-in-progress: false
    name: Bump Engine Documentation
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Checkout engine sources
        uses: actions/checkout@v7.0.1
        with:
          repository: ToymanInteractive/toygine2
          ref: main
          path: engine
          submodules: recursive
          persist-credentials: false

      - name: Install Doxygen
        run: |
          sudo apt-get update -y
          sudo apt-get install -y graphviz
          curl --fail -L https://github.com/doxygen/doxygen/releases/download/Release_1_17_0/doxygen-1.17.0.linux.bin.tar.gz -o doxygen.tar.gz || { echo "Failed to download Doxygen"; exit 1; }
          tar -xzf doxygen.tar.gz || { echo "Failed to extract Doxygen"; exit 1; }
          cd doxygen-*
          sudo cp bin/doxygen /usr/local/bin/ || { echo "Failed to install Doxygen"; exit 1; }
          cd ..
          rm -rf doxygen-* doxygen.tar.gz
          doxygen --version

      - name: Build Doxygen XML
        working-directory: engine
        run: |
          cmake -DTOYGINE_BUILD_BENCHMARKS=OFF -DTOYGINE_BUILD_DOCS=ON -DTOYGINE_BUILD_EDITOR=OFF -DTOYGINE_BUILD_SAMPLES=OFF -DTOYGINE_BUILD_TESTS=OFF --preset linux-debug
          cmake --build --preset linux-debug --target docs

      - name: Sync API XML
        id: sync
        run: |
          test -f engine/docs/xml/index.xml || { echo "Doxygen produced no flat XML in engine/docs/xml"; exit 1; }

          rm -rf api-xml
          mkdir -p api-xml
          cp -R engine/docs/xml/. api-xml/
          echo "Synced $(find api-xml -name '*.xml' | wc -l) XML files"

          if [[ -z "$(git status --porcelain -- api-xml)" ]]; then
            echo "changed=false" >>"${GITHUB_OUTPUT}"
            echo "API XML is unchanged, nothing to commit"
          else
            echo "changed=true" >>"${GITHUB_OUTPUT}"
            git status --short -- api-xml
          fi
