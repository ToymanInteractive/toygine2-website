name: Deploy to GitHub Pages

on:
  push:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Checkout engine sources
        uses: actions/checkout@v7.0.1
        with:
          repository: ToymanInteractive/toygine2
          ref: main
          path: engine
          submodules: recursive
          persist-credentials: false

      - name: Install Doxygen
        run: |
          sudo apt-get update -y
          sudo apt-get install -y graphviz
          curl --fail -L https://github.com/doxygen/doxygen/releases/download/Release_1_18_0/doxygen-1.18.0.linux.bin.tar.gz -o doxygen.tar.gz || { echo "Failed to download Doxygen"; exit 1; }
          tar -xzf doxygen.tar.gz || { echo "Failed to extract Doxygen"; exit 1; }
          cd doxygen-*
          sudo cp bin/doxygen /usr/local/bin/ || { echo "Failed to install Doxygen"; exit 1; }
          cd ..
          rm -rf doxygen-* doxygen.tar.gz
          doxygen --version

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Doxygen XML
        working-directory: engine
        run: |
          cmake -DTOYGINE_BUILD_BENCHMARKS=OFF -DTOYGINE_BUILD_DOCS=ON -DTOYGINE_BUILD_EDITOR=OFF -DTOYGINE_BUILD_SAMPLES=OFF -DTOYGINE_BUILD_TESTS=OFF --preset linux-debug
          cmake --build --preset linux-debug --target docs
          # doxygen2docusaurus reads engine/docs/xml, see config/doxygen2docusaurus.json
          test -f docs/xml/index.xml || { echo "Doxygen produced no XML in engine/docs/xml"; exit 1; }

      - name: Build
        run: npm run build

      - name: Disable Jekyll processing
        run: touch build/.nojekyll

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: site
          path: build
          include-hidden-files: true
          if-no-files-found: error

  # The site is published to the engine repository's GitHub Pages, so
  # actions/deploy-pages (current repository only) does not apply. The build
  # is pushed to the gh-pages branch of ToymanInteractive/toygine2 with a
  # deploy key: the private half is the TOYGINE2_PAGES_DEPLOY_KEY secret here,
  # the public half a write-enabled deploy key in toygine2.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: https://toymaninteractive.github.io/toygine2/
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: site
          path: build

      - name: Deploy to toygine2 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          deploy_key: ${{ secrets.TOYGINE2_PAGES_DEPLOY_KEY }}
          external_repository: ToymanInteractive/toygine2
          publish_branch: gh-pages
          publish_dir: build
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          full_commit_message: >-
            deploy: ${{ github.repository }}@${{ github.sha }}
