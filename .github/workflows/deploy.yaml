name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

# A newer push to the same pull request (or its closing) cancels the run in
# progress, so a stale preview never lands after the cleanup.
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Checkout engine sources
        uses: actions/checkout@v7.0.1
        with:
          repository: ToymanInteractive/toygine2
          ref: main
          path: engine
          submodules: recursive
          persist-credentials: false

      - name: Install Doxygen
        run: |
          sudo apt-get update -y
          sudo apt-get install -y graphviz
          curl --fail -L https://github.com/doxygen/doxygen/releases/download/Release_1_18_0/doxygen-1.18.0.linux.bin.tar.gz -o doxygen.tar.gz || { echo "Failed to download Doxygen"; exit 1; }
          tar -xzf doxygen.tar.gz || { echo "Failed to extract Doxygen"; exit 1; }
          cd doxygen-*
          sudo cp bin/doxygen /usr/local/bin/ || { echo "Failed to install Doxygen"; exit 1; }
          cd ..
          rm -rf doxygen-* doxygen.tar.gz
          doxygen --version

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Doxygen XML
        working-directory: engine
        run: |
          cmake -DTOYGINE_BUILD_BENCHMARKS=OFF -DTOYGINE_BUILD_DOCS=ON -DTOYGINE_BUILD_EDITOR=OFF -DTOYGINE_BUILD_SAMPLES=OFF -DTOYGINE_BUILD_TESTS=OFF --preset linux-debug
          cmake --build --preset linux-debug --target docs
          # doxygen2docusaurus reads engine/docs/xml, see config/doxygen2docusaurus.json
          test -f docs/xml/index.xml || { echo "Doxygen produced no XML in engine/docs/xml"; exit 1; }

      - name: Build
        run: npm run build
        env:
          # Read by docusaurus.config.ts; empty outside pull requests
          PREVIEW_BASE_URL: >-
            ${{ github.event_name == 'pull_request'
            && format('/toygine2/pr-preview/pr-{0}/',
            github.event.pull_request.number) || '' }}

      - name: Disable Jekyll processing
        run: touch build/.nojekyll

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: site
          path: build
          include-hidden-files: true
          if-no-files-found: error

  # The site is published to the engine repository's GitHub Pages, so
  # actions/deploy-pages (current repository only) does not apply. The build
  # is pushed to the gh-pages branch of ToymanInteractive/toygine2 with a
  # deploy key: the private half is the TOYGINE2_PAGES_DEPLOY_KEY secret here,
  # the public half a write-enabled deploy key in toygine2.
  #
  # Pull request previews live in pr-preview/pr-<number>/ of the same branch.
  # The main deploy cleans everything except that folder, each preview cleans
  # only its own subfolder, and closing the pull request removes it. Forks get
  # no secrets, so their pull requests are built but not previewed.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: https://toymaninteractive.github.io/toygine2/
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Download artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: site
          path: build

      - name: Deploy to toygine2 GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          ssh-key: ${{ secrets.TOYGINE2_PAGES_DEPLOY_KEY }}
          repository-name: ToymanInteractive/toygine2
          branch: gh-pages
          folder: build
          clean: true
          clean-exclude: pr-preview/
          git-config-name: github-actions[bot]
          git-config-email: 41898282+github-actions[bot]@users.noreply.github.com
          commit-message: >-
            deploy: ${{ github.repository }}@${{ github.sha }}

  deploy-preview:
    needs: build
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: pr-preview
      url: >-
        https://toymaninteractive.github.io/toygine2/pr-preview/pr-${{
        github.event.pull_request.number }}/
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Download artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: site
          path: build

      - name: Deploy preview to toygine2 GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          ssh-key: ${{ secrets.TOYGINE2_PAGES_DEPLOY_KEY }}
          repository-name: ToymanInteractive/toygine2
          branch: gh-pages
          folder: build
          target-folder: pr-preview/pr-${{ github.event.pull_request.number }}
          clean: true
          git-config-name: github-actions[bot]
          git-config-email: 41898282+github-actions[bot]@users.noreply.github.com
          commit-message: >-
            preview: ${{ github.repository }}#${{
            github.event.pull_request.number }}@${{
            github.event.pull_request.head.sha }}

      # One comment per pull request, updated in place on every push
      - name: Comment preview link
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: pr-preview
          message: |
            Site preview for ${{ github.event.pull_request.head.sha }}:
            https://toymaninteractive.github.io/toygine2/pr-preview/pr-${{ github.event.pull_request.number }}/

            GitHub Pages may need a minute or two to publish it.

  remove-preview:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Syncing an empty folder with clean deletes the preview subfolder
      - name: Create empty folder
        run: mkdir empty

      - name: Remove preview from toygine2 GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          ssh-key: ${{ secrets.TOYGINE2_PAGES_DEPLOY_KEY }}
          repository-name: ToymanInteractive/toygine2
          branch: gh-pages
          folder: empty
          target-folder: pr-preview/pr-${{ github.event.pull_request.number }}
          clean: true
          git-config-name: github-actions[bot]
          git-config-email: 41898282+github-actions[bot]@users.noreply.github.com
          commit-message: >-
            preview: remove ${{ github.repository }}#${{
            github.event.pull_request.number }}

      - name: Comment preview removal
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: pr-preview
          only_update: true
          message: |
            Site preview removed: the pull request is closed.
